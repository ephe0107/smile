services:
  - type: web
    name: smile2032
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PIN
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
    disk:
      name: smile2032-data
      mountPath: /var/data
      sizeGB: 1
